<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Crédito</title>

    <link rel="stylesheet" href="simulador.css">

    <script src="simulador.js"></script>
    <script src="funciones.js"></script>
</head>

<body>

<div class="container">

    <div class="logo">

        <div class="logo-icon">
            <div class="logo-circle">$</div>
        </div>

        <div class="logo-text">
            <h3>FINANCREDIT</h3>
            <small>Entidad Financiera</small>
        </div>

    </div>

    <h1>Simulador de Crédito</h1>

    <h2>Datos Financieros</h2>

    <label>Ingresos</label>
    <div class="grupoInput">
    <input type="text" id="txtIngresos">
    </div>

    <label>Egresos</label>
    <div class="grupoInput">
    <input type="text" id="txtEgresos">
    </div>

    <p>Disponible
        <span id="spnDisponible"></span>
    </p>

    <p>Capacidad de pago mensual
        <span id="spnCapacidadPago"></span>
    </p>

    <h2>Solicitud de Crédito</h2>

    <label>Monto</label>
    <div class="grupoInput">
    <input type="text" id="txtMonto">
    </div>

    <label>Plazo en años</label>
    <div class="grupoInput">
    <input type="text" id="txtPlazo">
    </div>

    <label>Tasa de interés (%)</label>
    <div class="grupoInput">
    <input type="text" id="txtTasaInteres">
    </div>

    <p>Interés a pagar
        <span id="spnInteresPagar"></span>
    </p>

    <p>Total préstamo
        <span id="spnTotalPrestamo"></span>
    </p>

    <p>Cuota mensual
        <span id="spnCuotaMensual"></span>
    </p>

    <p>Estado de crédito
        <span id="spnEstadoCredito">ANALIZANDO...</span>
    </p>

    <div class="buttons">

        <button id="btnCalcularCredito" onclick="calcular()">
            Calcular Crédito
        </button>

        <button id="btnReiniciar">
            Reiniciar
        </button>

    </div>

</div>

</body>
</html>
